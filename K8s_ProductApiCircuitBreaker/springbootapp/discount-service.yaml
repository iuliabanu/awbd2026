apiVersion: v1
kind: Service
metadata:
  name: discount-service
  namespace: app
spec:
  selector:
    app: discount-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  # ClusterIP: only reachable inside the cluster.
  # product-api calls this via discount-service.app.svc.cluster.local.
  # Not routed through the gateway — this is a service-to-service call.
  type: ClusterIP
