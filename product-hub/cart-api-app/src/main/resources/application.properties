# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cart_db}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JSON
spring.jackson.serialization.indent-output=true

# OAuth2 Resource Server - JWT validation
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/demo/protocol/openid-connect/certs}

# product-api base URL (for stock update in Saga Step 3)
product.service.uri=${PRODUCT_SERVICE_URI:http://product-api:8080}

# Resilience4j - circuit breaker for product-api calls
resilience4j.circuitbreaker.instances.productStock.sliding-window-size=5
resilience4j.circuitbreaker.instances.productStock.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.productStock.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productStock.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.productStock.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.productStock.automatic-transition-from-open-to-half-open-enabled=true

# Buyback points rule: 1 point per 10 units of currency
cart.points.rate=10

