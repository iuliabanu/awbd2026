server:
  port: 8080

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/demo/protocol/openid-connect/certs}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_ORIGIN:http://localhost:3000}"
            allowedMethods: [ "GET","POST","PUT","DELETE","OPTIONS" ]
            allowedHeaders: [ "*" ]
            allowCredentials: true

      routes:
        # Discount-service route — must come BEFORE the product-api catch-all
        - id: discount-service-route
          uri: ${DISCOUNT_SERVICE_URI:http://discount-service:8080}
          predicates:
            - Path=/api/discounts/**

        # Cart-api route — must come BEFORE product-api catch-all
        - id: cart-api-route
          uri: ${CART_API_URI:http://cart-api:8080}
          predicates:
            - Path=/api/cart/**

        - id: product-api-route
          uri: ${PRODUCT_API_URI:http://product-api.app.svc.cluster.local}
          predicates:
          - Path=/api/**

      # Default filters applied to every route.
      default-filters:
        # Add X-Request-ID header for distributed tracing.
      - AddRequestHeader=X-Gateway, spring-cloud-gateway

# Expose only the health endpoint externally — sufficient for K8s probes.
# The full actuator set is available on the management port if needed.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
